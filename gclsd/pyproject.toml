[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "windy-gclsd"
version = "0.1.0"
description = "Graph-conditioned decompiler model for Windy"
requires-python = ">=3.12"
dependencies = [
    "torch==2.5.1+cu124",
    "bitsandbytes",
    "peft",
    "accelerate",
    "torch-geometric",
    "transformers",
    "tokenizers",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyarrow",
    "duckdb",
    "datasets",
    "pytest",
]

[project.optional-dependencies]
# Gated DeltaNet backbone (experimental; requires triton, not on Windows by default).
gdn = ["flash-linear-attention"]

[project.scripts]
windy-gclsd-server = "windy_gclsd.server:main"

[[tool.uv.index]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "torch-cu124", marker = "sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
