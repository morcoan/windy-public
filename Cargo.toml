[package]
name = "windy"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A static Windows PE reverse-engineering workbench and pure MCP analysis server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/morcoan/windy"
readme = "README.md"
keywords = ["reverse-engineering", "mcp", "decompiler", "pe", "windows"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.35", features = ["default", "persistence"] }
egui = "0.35.0"
egui_dock = "0.20"
egui_extras = "0.35"
iced-x86 = "1.21.0"
memmap2 = "0.9.11"
fallible-iterator = "0.2"
pdb = "0.8"
petriage = "0.5.0"
postcard = { version = "1", features = ["alloc"] }
regex = "1"
rfd = "0.15"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2"
uuid = { version = "1", features = ["serde"] }
wgpu = { version = "22", features = ["dx12"] }
msvc-demangler = "0.11.0"
cpp_demangle = "0.5.1"
rsleigh-api = "0.4.1"
pcode-ir = "0.4.1"
rmcp = { version = "1", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
http-body-util = "0.1"
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
