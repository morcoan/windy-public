[package]
name = "windy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = { version = "0.35", features = ["default", "persistence"] }
egui = "0.35.0"
egui_dock = "0.20"
egui_extras = "0.35"
exe = "0.5.7"
iced-x86 = "1.21.0"
memmap2 = "0.9.11"
petriage = "0.5.0"
rfd = "0.15"
ron = "0.8"
serde = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "22", features = ["dx12"] }
