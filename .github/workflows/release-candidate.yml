name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a draft GitHub release (requires explicit authorization)"
        required: true
        type: boolean
        default: false
      version:
        description: "Artifact version"
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare dry-run release candidate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-rc-${{ hashFiles('**/Cargo.lock') }}

      - name: Run mandatory gate
        shell: pwsh
        run: |
          cargo build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run strict pure-V2 acceptance scorecard
        shell: pwsh
        run: |
          $bench = Join-Path $PWD "dist\benchmark\v0.1.0-rc"
          New-Item -ItemType Directory -Path $bench -Force | Out-Null
          $env:WINDY_SCRATCH = $bench
          $reportPath = Join-Path $bench "strict-v2.json"
          cargo run --quiet -- bench grand --suite v2-strict --output $reportPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $share = Get-Content (Join-Path $bench "engine_share_v2.json") -Raw | ConvertFrom-Json
          $baselinePath = '.\docs\benchmarks\v0.1.0-baseline.json'
          $baseline = Get-Content $baselinePath -Raw | ConvertFrom-Json
          if ($baseline.schema -ne "windy_exact_address_baseline" -or $baseline.version -ne 1) { throw "Unsupported v0.1 baseline schema" }
          $manifestHash = (Get-FileHash $baseline.manifest.path -Algorithm SHA256).Hash.ToLowerInvariant()
          $baselineReportHash = (Get-FileHash $baseline.report.path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -ne $baseline.manifest.sha256) { throw "Grand manifest hash differs from the locked v0.1 baseline" }
          if ($baselineReportHash -ne $baseline.report.sha256) { throw "Checked-in v0.1 baseline report hash is invalid" }
          if ($report.windy.overall_mean -lt $baseline.score_bounds.overall_mean_min) { throw "Strict score regressed below the exact v0.1 baseline" }
          if ($report.windy.catastrophic_rate -gt $baseline.score_bounds.catastrophic_rate_max) { throw "Catastrophic rate regressed above the exact v0.1 baseline" }
          if ($report.omitted_functions.Count -gt $baseline.limits.omitted_functions_max) { throw "Omitted-function count increased above baseline" }
          if ($report.windy.empty_decomp_count -gt $baseline.limits.empty_present_functions_max) { throw "Pure-V2 produced too many empty present decompilations" }
          if ($report.ghidra.functions_scored -ne $report.windy.functions_scored) { throw "Ghidra does not cover the exact Windy VA set" }
          if ($report.windy.functions_scored -ne $baseline.coverage.functions_scored) { throw "Function coverage differs from the locked v0.1 baseline" }
          if ($share.v2_pure_fraction -ne $baseline.pure_v2.required_share) { throw "Pure-V2 share differs from the locked requirement" }
          if ($share.pure_fallback_count -gt $baseline.pure_v2.fallbacks_max) { throw "Pure-V2 fallback count exceeds the locked limit" }

      - name: Install SBOM generator
        run: cargo install cargo-cyclonedx --locked

      - name: Build and package release candidate
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version '${{ inputs.version }}'

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: windy-v${{ inputs.version }}-windows-x64
          path: |
            dist/windy-v${{ inputs.version }}-windows-x64.zip
            dist/windy-v${{ inputs.version }}-windows-x64.zip.sha256
            dist/benchmark/v0.1.0-rc/**
          if-no-files-found: error

  publish-draft:
    name: Create explicitly authorized draft release
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: windy-v${{ inputs.version }}-windows-x64
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}-rc.${{ github.run_number }}"
          dist/*
          --draft
          --target "${{ github.sha }}"
          --title "Windy v${{ inputs.version }} release candidate"
          --notes "Draft release candidate produced by the manual workflow. Validate dogfood results before publication."
