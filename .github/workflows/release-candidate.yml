name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a draft GitHub release (requires explicit authorization)"
        required: true
        type: boolean
        default: false
      version:
        description: "Artifact version"
        required: true
        type: string
        default: "0.3.0"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare dry-run release candidate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-rc-${{ hashFiles('**/Cargo.lock') }}

      - name: Run mandatory v0.3 gate
        shell: pwsh
        run: |
          cargo fmt -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover eval/microbench
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Assert terminal-only dependency graph
        shell: pwsh
        run: |
          $tree = cargo tree --locked
          $blocked = $tree | Select-String -Pattern '(?i)\b(eframe|egui|egui_dock|egui_extras|rfd|winit|wgpu)\b'
          if ($blocked) { throw "GUI/GPU dependency found:`n$blocked" }

      - name: Install SBOM generator
        run: cargo install cargo-cyclonedx --locked

      - name: Build and package release candidate
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version '${{ inputs.version }}'

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: windy-v${{ inputs.version }}-windows-x64
          path: |
            dist/windy-v${{ inputs.version }}-windows-x64.zip
            dist/windy-v${{ inputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error

  publish-draft:
    name: Create explicitly authorized draft release
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: windy-v${{ inputs.version }}-windows-x64
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}-rc.${{ github.run_number }}"
          dist/*
          --draft
          --target "${{ github.sha }}"
          --title "Windy v${{ inputs.version }} release candidate"
          --notes "Draft release candidate produced by the manual v0.3 workflow. Review benchmark and smoke results before publication."
