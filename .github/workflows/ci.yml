name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows release gate
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Streamable HTTP MCP integration
        run: cargo test streamable_http_release_contract_and_persistence

      - name: Per-exit return regression
        run: cargo test divergent_exit_expressions_never_leak_between_blocks

      - name: Test
        run: cargo test

      - name: Agent bench harness tests
        run: cargo test -p agent-bench

      - name: Decompile scorecard smoke
        run: cargo run --quiet -- bench scorecard

  artifact-smoke:
    name: Windows packaged executable smoke
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build stripped release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Smoke packaged executable and MCP loop
        shell: pwsh
        run: .\scripts\smoke-release.ps1 -ExePath .\target\x86_64-pc-windows-msvc\release\windy.exe

      - name: Upload dry-run executable
        uses: actions/upload-artifact@v4
        with:
          name: windy-windows-x64-smoke
          path: target/x86_64-pc-windows-msvc/release/windy.exe
          if-no-files-found: error

  dependency-policy:
    name: Dependency, license, and advisory policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked
          command-arguments: advisories licenses sources

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
