[package]
name = "agent-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent-loop harness: Windy evidence tools vs python/pefile baseline"
publish = false

[[bin]]
name = "agent-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# reqwest stays out of windy; only this eval crate talks HTTP to Anthropic / MCP.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
